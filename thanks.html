<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Thanks — David Petry</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23080a0e'/%3E%3Ctext x='50' y='68' font-size='56' font-family='Georgia,serif' font-style='italic' fill='%23e8a030' text-anchor='middle'%3EDP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#080a0e;--white:#f0f2f8;--text:#d8dce8;--muted2:#7c86a8;--amber:#e8a030;--radius:6px;
--sans:'Outfit',system-ui,sans-serif;--mono:'DM Mono',monospace;--serif:'Cormorant Garamond',Georgia,serif;}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 24px;text-align:center;line-height:1.7}
h1{font-family:var(--serif);font-size:clamp(40px,6vw,64px);font-weight:600;color:var(--white);line-height:1.1;margin-bottom:16px}
h1 em{color:var(--amber);font-style:italic}
p{color:var(--muted2);max-width:46ch;margin:0 auto 32px}
a.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 24px;background:var(--amber);color:var(--bg);border-radius:var(--radius);font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;text-decoration:none}
a.btn:hover{opacity:.88}
a:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
</style>
</head>
<body>
<main>
  <h1>You're on the <em>list</em></h1>
  <p>Thanks — I'll send a note when the next Prompt Book edition drops. No spam, no reselling your address.</p>
  <a class="btn" href="index.html">Back to the site</a>
</main>
</body>
</html>
